            <h1 class='post-title'>2024-02-02-</h1>
            <div class="post-content"># <br><br>「我還是有幾個會聊天的好朋友的」<br>我覺得自己在社交上面真的是有很大天生的障礙，某方面是這個領域的殘障<br>理所當然的會被別人嘲笑<br>但是我真的是小丑<br>我覺得自己的悲慘能夠成為別人的笑料也是一種價值<br>被嘲笑本身並不會少一塊肉還可以讓別人覺得好笑<br>就算被嘲笑還是能夠跟自己愛的人或在乎自己的人度過有品質的時光<br>我的生活還是照過 不會因為這樣變得比較美好或者悲慘<br>人活著本身就不會得到所有人的喜歡，也常常會被人討厭<br>也不會得到所有人的理解<br>不太需要在意與自己遙遠的人的看法<br>還是會有人愛我理解我的<br>那樣就很夠了<br><br></div>
